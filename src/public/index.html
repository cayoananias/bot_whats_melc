<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Painel Financeiro</title><style>body{font-family:system-ui;max-width:1000px;margin:32px auto;padding:0 16px;background:#f7f8fa}input,button{padding:10px;margin:4px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#fff;padding:18px;border-radius:8px;min-width:145px;box-shadow:0 1px 3px #ccc}table{width:100%;background:#fff;border-collapse:collapse;margin-top:20px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>Financeiro WhatsApp</h1><section id="login"><input id="phone" placeholder="Telefone"><input id="password" type="password" placeholder="Senha"><button onclick="login()">Entrar</button></section><main id="app" hidden><h2>Dashboard</h2><div class="cards" id="cards"></div><h2>Lançamentos</h2><table><thead><tr><th>Data</th><th>Tipo</th><th>Valor</th><th>Categoria</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></main><script>let token='';async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone:phone.value,password:password.value})});let j=await r.json();if(!r.ok)return alert(j.error);token=j.token;login.hidden=true;app.hidden=false;load()}async function load(){let h={authorization:'Bearer '+token};let[d,t]=await Promise.all([fetch('/api/admin/dashboard',{headers:h}).then(x=>x.json()),fetch('/api/admin/transactions',{headers:h}).then(x=>x.json())]);cards.innerHTML=Object.entries(d).map(([k,v])=>`<div class=card><b>${k}</b><br>${typeof v==='number'&&['income','expense','balance'].includes(k)?'R$ ':''}${v}</div>`).join('');rows.innerHTML=t.map(x=>`<tr><td>${x.date.slice(0,10)}</td><td>${x.type}</td><td>R$ ${Number(x.amount).toFixed(2)}</td><td>${x.category?.name||''}</td><td>${x.status}</td></tr>`).join('')}</script></body></html>
